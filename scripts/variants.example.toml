# scripts/measure_extraction.py に渡す「変える設定」の一覧。
# label 以外が Ollama への要求に入る値で、それ以外（プロンプト、chunk_minutes、入力の発話）は
# すべての variant で共通になる。だから、結果の違いはここに書いた値の違いだけに帰せられる。
#
# model: 空文字なら config.toml の extract.ollama.model を使う
# think: true / false を書くとその値を送る。キーを書かなければ variant では指定せず、
#        config.toml の extract.ollama.think のまま（TOML には null が無いため）
# num_ctx / num_predict: 0（または書かない）なら config.toml の値を使う
# timeout_sec: 0 なら config.toml の値を使う。正の値のときだけ上書きする
#
# モデル名は推奨・未確定（2026-11-05 設計者の初期値）。存在するかは `ollama list` で確認し、
# 無ければ `ollama pull <モデル名>` で取得する（取得はユーザーが行う）。
# 上書きの結果が設定の検査（入力が num_ctx に収まるか等）に通らない variant は、測る前に拒否される。

[[variant]]
label = "q35-9b-think"
model = "qwen3.5:9b"
think = true

[[variant]]
label = "q35-9b-nothink"
model = "qwen3.5:9b"
think = false

[[variant]]
label = "q3-14b-think"
model = "qwen3:14b"
think = true

[[variant]]
label = "q3-14b-nothink"
model = "qwen3:14b"
think = false
