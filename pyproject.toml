[project]
name = "kijun"
version = "0.1.0"
description = "会話の録音を文字起こしし、議事録にまとめる仕組み"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "pydantic>=2.9",
    "typer>=0.12",
    "mutagen>=1.47",
    "numpy>=2.0",
]

# 重い依存は用途別の extra に分ける。`uv sync` の既定では入らない。
[project.optional-dependencies]
transcribe = ["av", "faster-whisper>=1.0", "pyannote.audio>=3.3", "torch>=2.4", "torchaudio>=2.4",
    # Windows の wheel がある版に限る。uv.lock が 12.9.3.13 に固定されていたとき、その版には
    # Windows の wheel が無く `uv sync --extra transcribe` が失敗した（2026-11-03 実機）。
    # 実機で動いているのは cublas 12.9.2.10 と cudnn 9.27.0.42。
    "nvidia-cublas-cu12>=12.9.2,<12.9.3; sys_platform == 'win32'",
    "nvidia-cudnn-cu12>=9.27,<9.28; sys_platform == 'win32'",
]
extract = ["httpx>=0.27"]
discord = ["discord.py>=2.4"]

[dependency-groups]
dev = ["pytest>=8.0", "av"]

[project.scripts]
kijun = "kijun.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kijun"]

# Windows で torch を CUDA 版にするための設定。2026-11-05 に有効にした（以前はコメントアウトしていた）。
# 有効にした理由: これが無いと `uv run` / `uv sync` が CPU 版の torch を入れ直し、文字起こし・話者分離・
# 夜間バッチが GPU を使えなくなる。実機（Windows）で動かすことが本来の用途なので、こちらを既定にした。
# 注意: uv は `uv sync` のたびにここに書いた index へ接続して全 extra のパッケージ情報を取得する。
# download.pytorch.org に接続できない環境（例: 外向き通信を制限したクラウドコンテナ）では、
# extra を使わない場合でも `uv sync` 自体が失敗する。その環境では下の 8 行をコメントアウトする。
# `uv sync` は extra を全部指定する（`uv sync --all-extras`）。一部だけ指定すると他の extra の
# パッケージ（faster-whisper など）が消える。
# タグ cu132 は 2026-11-03 に https://pytorch.org/get-started/locally/ で確認した値（CUDA 13.2、torch 2.15.0）。
# 現在も正しいかは同じページで確認し、
# 違う場合は index の name と url、sources の index 名の 3 か所を書き換える。
#
[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu132", marker = "sys_platform == 'win32'" }]
torchaudio = [{ index = "pytorch-cu132", marker = "sys_platform == 'win32'" }]

[tool.pytest.ini_options]
addopts = "-m 'not requires_gpu and not requires_network'"
testpaths = ["tests"]
markers = [
    "requires_gpu: GPU と大きなモデルファイルが必要。クラウド環境では実行しない",
    "requires_network: 外部サービス（Ollama の推論サーバー、Hugging Face）への通信が必要",
]
